<!doctype html>
<!-- Source for public/og.png (1200×630). Regenerate with: npm run og (needs Playwright browsers) -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Unbounded';
        src: url('../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 200 900;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2')
          format('woff2');
        font-weight: 100 800;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #07070a;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.35;
      }
      .orb {
        position: absolute;
        right: -80px;
        top: 50%;
        width: 560px;
        height: 560px;
        transform: translateY(-50%);
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 28%, #fff 0 4%, transparent 18%),
          radial-gradient(circle at 70% 75%, rgb(158 240 255 / 0.7), transparent 35%),
          radial-gradient(circle at 25% 70%, rgb(255 179 230 / 0.6), transparent 35%),
          radial-gradient(circle at 50% 50%, #c9ced8 0, #4a4f5a 40%, #0e0e13 70%);
        box-shadow:
          0 0 140px 20px rgb(199 164 255 / 0.25),
          inset -30px -40px 80px #000;
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 170px;
        margin: 0;
        font: 900 200px/0.85 'Unbounded';
        letter-spacing: -0.04em;
        text-transform: uppercase;
        background: linear-gradient(
          180deg,
          #fff 0%,
          #c9ced8 36%,
          #7d8391 49%,
          #2c2f37 50%,
          #c9ced8 53%,
          #fff 72%,
          #7d8391 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        position: absolute;
        left: 80px;
        font: 500 22px 'JetBrains Mono';
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #9a9ca8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      class="glow"
      style="left: -100px; top: -150px; width: 500px; height: 500px; background: #c7a4ff"
    ></div>
    <div
      class="glow"
      style="
        right: 200px;
        bottom: -200px;
        width: 500px;
        height: 500px;
        background: #9ef0ff;
      "
    ></div>
    <div class="orb"></div>
    <p style="top: 110px">developer · tinkerer</p>
    <h1>slvrr</h1>
    <p style="top: 470px; color: #eceef2">slvrr.dev</p>
  </body>
</html>
